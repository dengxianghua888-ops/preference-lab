name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        # uv.lock pins every package with hashes; --locked fails if it is stale.
        run: |
          uv sync --locked --extra dev --extra dashboard
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint with ruff
        run: |
          ruff check .
          python -m mypy
          ruff format --check .

      - name: Run tests
        run: |
          pytest tests/ -q --tb=short --cov=src/ecoalign_forge --cov-report=term-missing

      - name: Build distributions and run installed demo outside checkout
        run: |
          python -m hatchling build
          uv pip install --force-reinstall --no-deps dist/*.whl
          demo_bin="$PWD/.venv/bin/ecoalign-forge"
          cd "$(mktemp -d)"
          # Missing external facts make four recorded cases abstain (exit 3).
          demo_exit=0
          "$demo_bin" --demo --num-samples 5 || demo_exit=$?
          test "$demo_exit" -eq 3

      - name: Deterministic success and controlled failure evidence
        run: |
          python scripts/accept_iteration_a.py --output /tmp/ecoalign-acceptance-a
          python scripts/accept_iteration_b.py --output /tmp/ecoalign-acceptance-b
          python scripts/accept_iteration_c.py --output /tmp/ecoalign-acceptance-c

  consumers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        consumer: [trl, llamafactory]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Build deterministic dataset
        run: |
          UV_PROJECT_ENVIRONMENT=/tmp/kernel uv sync --locked --extra dev
          /tmp/kernel/bin/python scripts/accept_iteration_c.py --output /tmp/acceptance
      - name: Install isolated locked consumer
        run: |
          uv venv /tmp/consumer
          uv pip install --python /tmp/consumer/bin/python --torch-backend cpu -r scripts/consumers/${{ matrix.consumer }}.lock
      - name: Actual loader, template, tokenizer and collator
        run: |
          DATASET=$(/tmp/kernel/bin/python -c 'import json; print(json.load(open("/tmp/acceptance/acceptance.json"))["first_dataset"])')
          /tmp/consumer/bin/python scripts/consumers/verify.py ${{ matrix.consumer }} "$DATASET" --output /tmp/${{ matrix.consumer }}-acceptance.json
      - uses: actions/upload-artifact@v7
        with:
          name: consumer-${{ matrix.consumer }}
          path: /tmp/${{ matrix.consumer }}-acceptance.json
